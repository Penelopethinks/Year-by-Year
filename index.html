<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Year by Year — Custom Calendars</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs" type="module"></script>
<style>
:root{--ink:#171717;--muted:#777;--paper:#faf9f6;--card:#fff;--line:#e7e4de;--accent:#171717}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);background:var(--paper)}
button,input,textarea,select{font:inherit}button{cursor:pointer}.top{background:var(--ink);color:white;text-align:center;padding:9px;font-size:12px;letter-spacing:.08em}
header{position:sticky;top:0;z-index:20;background:rgba(250,249,246,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav{max-width:1180px;margin:auto;height:76px;display:flex;align-items:center;gap:28px;padding:0 22px}.brand{font-family:Georgia,serif;font-size:25px;font-weight:700;margin-right:auto;cursor:pointer}.nav button{border:0;background:none;font-weight:600;color:#444}.nav .primary{background:var(--ink);color:#fff;padding:11px 16px;border-radius:999px}
main{max-width:1180px;margin:auto;padding:34px 22px 80px}.hero{display:grid;grid-template-columns:1.35fr .65fr;gap:24px;align-items:stretch}.heroCard{background:#eee9df;border-radius:28px;padding:55px;min-height:370px;display:flex;flex-direction:column;justify-content:center}.hero h1{font:700 clamp(45px,7vw,82px)/.92 Georgia,serif;margin:0 0 22px;letter-spacing:-.04em}.hero p{font-size:18px;max-width:620px;color:#555;line-height:1.6}.heroArt{border-radius:28px;background:white;border:1px solid var(--line);padding:22px;display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.mini{border:1px solid #ddd;border-radius:18px;padding:14px;min-height:145px}.mini b{font-family:Georgia,serif;font-size:19px}.mini small{display:block;color:#888;margin-top:12px}.sectionHead{display:flex;align-items:end;justify-content:space-between;margin:55px 0 20px}.sectionHead h2{font:700 36px Georgia,serif;margin:0}.filters{display:flex;gap:8px;flex-wrap:wrap}.chip{border:1px solid var(--line);background:white;padding:8px 13px;border-radius:999px}.chip.active{background:var(--ink);color:white}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.product{background:white;border:1px solid var(--line);border-radius:22px;overflow:hidden}.cover{aspect-ratio:1/1.05;background:#f1efe9;display:flex;align-items:center;justify-content:center;padding:14px;position:relative}.cover img{max-width:100%;max-height:100%;object-fit:contain}.cover .badge{position:absolute;top:12px;left:12px;background:white;border-radius:999px;padding:6px 9px;font-size:11px;font-weight:700}.info{padding:18px}.info h3{margin:0 0 7px;font:700 22px Georgia,serif}.muted{color:var(--muted)}.price{font-weight:800;margin:10px 0}.actions{display:flex;gap:8px}.btn{border:1px solid var(--ink);background:white;border-radius:12px;padding:10px 13px}.btn.dark{background:var(--ink);color:#fff}.empty{border:1px dashed #bbb;border-radius:18px;padding:45px;text-align:center;color:#777;grid-column:1/-1}
footer{border-top:1px solid var(--line);padding:35px 22px;color:#777;text-align:center}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.48);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}.modal.show{display:flex}.panel{background:white;border-radius:24px;width:min(920px,100%);max-height:92vh;overflow:auto;padding:28px}.close{float:right;border:0;background:#eee;border-radius:50%;width:36px;height:36px}.viewer{display:flex;flex-direction:column;gap:14px;margin-top:20px}.viewer canvas{width:100%;height:auto;border:1px solid #ddd;background:white}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:flex;flex-direction:column;gap:7px;margin:12px 0}.field label{font-size:13px;font-weight:700}.field input,.field textarea,.field select{border:1px solid #d8d5cf;border-radius:10px;padding:11px;background:white}.field textarea{min-height:90px;resize:vertical}.adminTabs{display:flex;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:20px}.tab{border:0;background:#eee;padding:10px 14px;border-radius:10px}.tab.active{background:var(--ink);color:#fff}.adminGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:#f5f3ef;border-radius:16px;padding:18px}.stat strong{display:block;font-size:28px}.adminRow{border:1px solid var(--line);border-radius:16px;padding:15px;margin:10px 0;background:#fff}.adminRowHead{display:flex;justify-content:space-between;gap:10px;align-items:center}.small{font-size:12px}.danger{color:#a11;border-color:#d9aaaa}.notice{background:#f4f1e9;border-radius:12px;padding:12px;margin:12px 0;color:#555}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#171717;color:#fff;padding:12px 17px;border-radius:999px;display:none;z-index:100}
@media(max-width:800px){.hero{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}.adminGrid{grid-template-columns:repeat(2,1fr)}.heroCard{padding:35px}.nav{gap:12px}.nav button{display:none}.nav .primary{display:block}}
@media(max-width:520px){.grid{grid-template-columns:1fr}.two{grid-template-columns:1fr}.heroArt{display:none}.adminGrid{grid-template-columns:1fr}.nav{height:64px}main{padding-top:22px}}
</style>
</head>
<body>
<div class="top" id="announcement">MAKE EVERY MONTH MEAN SOMETHING.</div>
<header><div class="nav"><div class="brand" onclick="go('home')">Year by Year</div><button onclick="go('home')">Home</button><button onclick="go('shop')">Calendars</button><button onclick="go('orders')">Orders</button><button onclick="go('about')">About</button><button class="primary" onclick="adminLogin()">Admin</button></div></header>
<main id="app"></main>
<footer><div id="footerText">© Year by Year</div></footer>
<div class="modal" id="modal"><div class="panel"><button class="close" onclick="closeModal()">×</button><div id="modalBody"></div></div></div>
<div class="toast" id="toast"></div>
<script>
const KEY='yby_data_v3';
let state=JSON.parse(localStorage.getItem(KEY)||'null')||{
 settings:{storeName:'Year by Year',headline:'A calendar for every kind of year.',subtitle:'Thoughtfully designed calendars you can actually live with.',about:'Year by Year creates simple, beautiful calendars made to bring a little more joy to everyday planning.',contact:'hello@yearbyyear.com',shipping:'Shipping is calculated at checkout.',currency:'$'},
 products:[],orders:[],adminLogged:false
};
let activeTab='dashboard', filter='All';
function save(){localStorage.setItem(KEY,JSON.stringify(state));render()}
function money(n){return (state.settings.currency||'$')+Number(n||0).toFixed(2)}
function go(p){location.hash=p;render()}
window.addEventListener('hashchange',render);
function render(){
 document.title=state.settings.storeName+' — Custom Calendars';
 document.getElementById('announcement').textContent=state.settings.announcement||'MAKE EVERY MONTH MEAN SOMETHING.';
 document.getElementById('footerText').textContent='© '+new Date().getFullYear()+' '+state.settings.storeName+' · '+(state.settings.contact||'');
 const p=location.hash.slice(1)||'home';
 if(p==='shop')shop(); else if(p==='orders')orders(); else if(p==='about')about(); else if(p==='admin'&&state.adminLogged)admin(); else home();
}
function home(){document.getElementById('app').innerHTML=
'<section class="hero"><div class="heroCard"><div class="muted">YEAR BY YEAR</div><h1>'+esc(state.settings.headline)+'</h1><p>'+esc(state.settings.subtitle)+'</p><div><button class="btn dark" onclick="go(\'shop\')">Shop calendars</button></div></div><div class="heroArt"><div class="mini"><b>12</b><small>months to fill with good things.</small></div><div class="mini"><b>01</b><small>beautiful calendar, one year at a time.</small></div><div class="mini"><b>∞</b><small>memories worth marking down.</small></div><div class="mini"><b>YBY</b><small>made by Year by Year.</small></div></div></section>'+
'<div class="sectionHead"><h2>Featured</h2><button class="btn" onclick="go(\'shop\')">View all</button></div><div class="grid">'+cards(state.products.filter(x=>x.featured&&x.visible!==false).slice(0,3))+'</div>'};
function shop(){let cats=['All',...new Set(state.products.map(x=>x.category).filter(Boolean))];let list=state.products.filter(x=>x.visible!==false&&(filter==='All'||x.category===filter));document.getElementById('app').innerHTML=
'<div class="sectionHead"><div><div class="muted">SHOP</div><h2>Calendars</h2></div><div class="filters">'+cats.map(c=>'<button class="chip '+(c===filter?'active':'')+'" onclick="filter='+JSON.stringify(c)+';shop()">'+esc(c)+'</button>').join('')+'</div></div><div class="grid">'+cards(list)+'</div>'}
function cards(list){return list.length?list.map(x=>'<article class="product"><div class="cover">'+(x.badge?'<span class="badge">'+esc(x.badge)+'</span>':'')+(x.image?'<img src="'+x.image+'">':'<div style="font:700 38px Georgia;color:#aaa">YEAR<br>BY YEAR</div>')+'</div><div class="info"><h3>'+esc(x.name)+'</h3><div class="muted">'+esc(x.category||'Calendar')+'</div><div class="price">'+money(x.price)+'</div><div class="actions"><button class="btn" onclick="view('+x.id+')">Preview</button><button class="btn dark" onclick="add('+x.id+')">Add to cart</button></div></div></article>').join(''):'<div class="empty">No calendars are published yet.<br><button class="btn" style="margin-top:12px" onclick="adminLogin()">Open Admin</button></div>'}
function about(){document.getElementById('app').innerHTML='<div style="max-width:760px;margin:50px auto"><div class="muted">ABOUT</div><h1 style="font:700 58px Georgia;margin:8px 0 22px">'+esc(state.settings.storeName)+'</h1><p style="font-size:19px;line-height:1.8">'+esc(state.settings.about)+'</p><div class="notice">'+esc(state.settings.shipping)+'</div><p>Contact: '+esc(state.settings.contact)+'</p></div>'}
function orders(){let orders=JSON.parse(localStorage.getItem('yby_orders')||'[]');document.getElementById('app').innerHTML='<div style="max-width:720px;margin:30px auto"><div class="muted">ORDERS</div><h2>Find your order</h2><div class="field"><label>Order email</label><input id="lookupEmail" type="email" placeholder="you@example.com"></div><button class="btn dark" onclick="lookup()">Find order</button><div id="lookupResult" style="margin-top:20px"></div></div>'}
function lookup(){let e=document.getElementById('lookupEmail').value.trim().toLowerCase();let os=JSON.parse(localStorage.getItem('yby_orders')||'[]').filter(o=>o.email.toLowerCase()===e);document.getElementById('lookupResult').innerHTML=os.length?os.map(o=>'<div class="adminRow"><b>'+o.number+'</b><div>'+o.items.map(i=>esc(i.name)+' × '+i.qty).join('<br>')+'</div><p>Status: <b>'+esc(o.status)+'</b></p></div>').join(''):'<div class="notice">No orders found for that email.</div>'}
function view(id){let p=state.products.find(x=>x.id===id);if(!p)return;document.getElementById('modalBody').innerHTML='<h2>'+esc(p.name)+'</h2><p class="muted">'+esc(p.description||'')+'</p><div class="viewer" id="viewer"></div><button class="btn dark" onclick="add('+p.id+');closeModal()">Add to cart · '+money(p.price)+'</button>';openModal();if(p.file)renderFile(p.file)}
function renderFile(file){let v=document.getElementById('viewer');if(!v)return;if(file.type==='image'){v.innerHTML='<img src="'+file.data+'" style="width:100%;border:1px solid #ddd">';return}if(file.type==='pdf'){v.innerHTML='<div class="notice">Loading every page…</div>';import('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs').then(async pdfjs=>{pdfjs.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs';let pdf=await pdfjs.getDocument(file.data).promise;v.innerHTML='';for(let n=1;n<=pdf.numPages;n++){let page=await pdf.getPage(n),scale=1.5,viewport=page.getViewport({scale}),c=document.createElement('canvas');c.width=viewport.width;c.height=viewport.height;v.appendChild(c);await page.render({canvasContext:c.getContext('2d'),viewport}).promise}}).catch(()=>v.innerHTML='<div class="notice">This PDF could not be previewed in this browser.</div>')}}
function add(id){let cart=JSON.parse(localStorage.getItem('yby_cart')||'[]');let p=state.products.find(x=>x.id===id);if(!p)return;let i=cart.find(x=>x.id===id);if(i)i.qty++;else cart.push({id:p.id,name:p.name,price:p.price,qty:1});localStorage.setItem('yby_cart',JSON.stringify(cart));toast('Added to cart');}
function cartHtml(){let cart=JSON.parse(localStorage.getItem('yby_cart')||'[]');let total=cart.reduce((a,x)=>a+x.price*x.qty,0);return '<div class="notice">Cart: '+(cart.reduce((a,x)=>a+x.qty,0)||0)+' item(s) · '+money(total)+' <button class="btn dark" style="float:right" onclick="checkout()">Checkout</button></div>'}
function checkout(){let cart=JSON.parse(localStorage.getItem('yby_cart')||'[]');if(!cart.length){toast('Your cart is empty');return}document.getElementById('modalBody').innerHTML='<h2>Place your order</h2><form onsubmit="placeOrder(event)"><div class="two"><div class="field"><label>Full name</label><input name="name" required></div><div class="field"><label>Email</label><input name="email" type="email" required></div></div><div class="field"><label>Shipping address</label><input name="address" required></div><div class="two"><div class="field"><label>City</label><input name="city" required></div><div class="field"><label>State</label><input name="state" required></div></div><div class="two"><div class="field"><label>ZIP code</label><input name="zip" required></div><div class="field"><label>Notes</label><input name="notes"></div></div><button class="btn dark">Submit order</button></form>';openModal()}
function placeOrder(e){e.preventDefault();let f=new FormData(e.target),cart=JSON.parse(localStorage.getItem('yby_cart')||'[]');let order={number:'YBY-'+Date.now().toString().slice(-7),created:new Date().toISOString(),name:f.get('name'),email:f.get('email'),address:f.get('address'),city:f.get('city'),state:f.get('state'),zip:f.get('zip'),notes:f.get('notes'),items:cart,status:'New'};let os=JSON.parse(localStorage.getItem('yby_orders')||'[]');os.push(order);localStorage.setItem('yby_orders',JSON.stringify(os));localStorage.removeItem('yby_cart');document.getElementById('modalBody').innerHTML='<h2>Order received!</h2><p>Your order number is <b>'+order.number+'</b>.</p><p>Keep it somewhere safe so you can check the status later.</p><button class="btn dark" onclick="closeModal();go(\'orders\')">Done</button>'}
function adminLogin(){if(state.adminLogged){go('admin');return}document.getElementById('modalBody').innerHTML='<h2>Admin access</h2><p class="muted">Enter your admin code.</p><div class="field"><label>Code</label><input id="adminCode" type="password" inputmode="numeric"></div><button class="btn dark" onclick="checkAdmin()">Enter</button>';openModal()}
function checkAdmin(){if(document.getElementById('adminCode').value==='713'){state.adminLogged=true;closeModal();go('admin')}else toast('Incorrect admin code')}
function admin(){let tabs=['dashboard','calendars','orders','settings'];document.getElementById('app').innerHTML='<div class="sectionHead"><div><div class="muted">CONTROL CENTER</div><h2>Admin</h2></div><button class="btn" onclick="state.adminLogged=false;go(\'home\')">Log out</button></div><div class="adminTabs">'+tabs.map(t=>'<button class="tab '+(activeTab===t?'active':'')+'" onclick="activeTab='+JSON.stringify(t)+';admin()">'+t[0].toUpperCase()+t.slice(1)+'</button>').join('')+'</div>'+({dashboard:dashboard,calendars:adminCalendars,orders:adminOrders,settings:adminSettings}[activeTab])()}
function dashboard(){let os=JSON.parse(localStorage.getItem('yby_orders')||'[]'),revenue=os.reduce((a,o)=>a+o.items.reduce((b,i)=>b+i.price*i.qty,0),0);return '<div class="adminGrid"><div class="stat"><span>Calendars</span><strong>'+state.products.length+'</strong></div><div class="stat"><span>Published</span><strong>'+state.products.filter(x=>x.visible!==false).length+'</strong></div><div class="stat"><span>Orders</span><strong>'+os.length+'</strong></div><div class="stat"><span>Order value</span><strong>'+money(revenue)+'</strong></div></div><div class="notice" style="margin-top:18px"><b>Admin code:</b> 713 · <b>Storage:</b> this browser only. Use a real backend before accepting live payments or orders.</div>'+os.slice(-5).reverse().map(orderRow).join('')}
function adminCalendars(){return '<div style="display:flex;justify-content:space-between;align-items:center"><h3>Calendar catalog</h3><button class="btn dark" onclick="editProduct()">+ Add calendar</button></div>'+state.products.map(p=>'<div class="adminRow"><div class="adminRowHead"><div><b>'+esc(p.name)+'</b><div class="muted small">'+esc(p.category||'Calendar')+' · '+money(p.price)+'</div></div><div><button class="btn" onclick="editProduct('+p.id+')">Edit</button> <button class="btn '+(p.visible===false?'':'dark')+'" onclick="toggleVisible('+p.id+')">'+(p.visible===false?'Publish':'Published')+'</button> <button class="btn danger" onclick="deleteProduct('+p.id+')">Delete</button></div></div></div>').join('')}
function editProduct(id){let p=id?state.products.find(x=>x.id===id):{id:Date.now(),name:'New Calendar',price:12,category:'Calendar',description:'',visible:true,featured:false,badge:''};document.getElementById('modalBody').innerHTML='<h2>'+(id?'Edit':'Add')+' calendar</h2><form onsubmit="saveProduct(event,'+p.id+')"><div class="two"><div class="field"><label>Name</label><input name="name" value="'+attr(p.name)+'" required></div><div class="field"><label>Price</label><input name="price" type="number" step=".01" value="'+p.price+'" required></div></div><div class="two"><div class="field"><label>Category</label><input name="category" value="'+attr(p.category||'')+'"></div><div class="field"><label>Badge</label><input name="badge" value="'+attr(p.badge||'')+'" placeholder="NEW"></div></div><div class="field"><label>Description</label><textarea name="description">'+esc(p.description||'')+'</textarea></div><div class="field"><label>Calendar file (PDF or image)</label><input id="calendarFile" type="file" accept=".pdf,image/*"></div><div><label><input name="featured" type="checkbox" '+(p.featured?'checked':'')+'> Featured</label></div><button class="btn dark" style="margin-top:18px">Save calendar</button></form>';openModal()}
function saveProduct(e,id){e.preventDefault();let f=new FormData(e.target),p=state.products.find(x=>x.id===id);if(!p){p={id};state.products.push(p)}p.name=f.get('name');p.price=Number(f.get('price'));p.category=f.get('category');p.badge=f.get('badge');p.description=f.get('description');p.featured=f.get('featured')==='on';p.visible=p.visible!==false;let file=document.getElementById('calendarFile').files[0];if(file){let reader=new FileReader();reader.onload=()=>{p.file={type:file.type==='application/pdf'?'pdf':'image',data:reader.result};save()};reader.readAsDataURL(file)}else save();closeModal()}
function toggleVisible(id){let p=state.products.find(x=>x.id===id);p.visible=p.visible===false;save()}
function deleteProduct(id){if(confirm('Delete this calendar?')){state.products=state.products.filter(x=>x.id!==id);save()}}
function adminOrders(){let os=JSON.parse(localStorage.getItem('yby_orders')||'[]');return '<div style="display:flex;justify-content:space-between;align-items:center"><h3>Customer orders</h3><button class="btn" onclick="exportOrders()">Export CSV</button></div>'+os.slice().reverse().map(orderRow).join('')}
function orderRow(o){return '<div class="adminRow"><div class="adminRowHead"><div><b>'+esc(o.number)+'</b><div class="muted small">'+esc(o.name)+' · '+esc(o.email)+'</div></div><select onchange="setStatus(\''+o.number+'\',this.value)">'+['New','Processing','Shipped','Complete','Cancelled'].map(s=>'<option '+(o.status===s?'selected':'')+'>'+s+'</option>').join('')+'</select></div><div style="margin-top:10px" class="small">'+o.items.map(i=>esc(i.name)+' × '+i.qty+' · '+money(i.price*i.qty)).join('<br>')+'</div><div class="muted small" style="margin-top:8px">'+esc(o.address)+', '+esc(o.city)+', '+esc(o.state)+' '+esc(o.zip)+'</div></div>'}
function setStatus(num,status){let os=JSON.parse(localStorage.getItem('yby_orders')||'[]'),o=os.find(x=>x.number===num);if(o){o.status=status;localStorage.setItem('yby_orders',JSON.stringify(os));toast('Order updated')}}
function exportOrders(){let os=JSON.parse(localStorage.getItem('yby_orders')||'[]');let rows=[['Order','Date','Name','Email','Address','Status','Items'],...os.map(o=>[o.number,o.created,o.name,o.email,[o.address,o.city,o.state,o.zip].join(' '),o.status,o.items.map(i=>i.name+' x'+i.qty).join('; ')])];let csv=rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='year-by-year-orders.csv';a.click()}
function adminSettings(){let s=state.settings;return '<h3>Store settings</h3><form onsubmit="saveSettings(event)"><div class="two"><div class="field"><label>Store name</label><input name="storeName" value="'+attr(s.storeName)+'"></div><div class="field"><label>Currency symbol</label><input name="currency" value="'+attr(s.currency||'$')+'"></div></div><div class="field"><label>Announcement bar</label><input name="announcement" value="'+attr(s.announcement||'MAKE EVERY MONTH MEAN SOMETHING.')+'"></div><div class="field"><label>Homepage headline</label><input name="headline" value="'+attr(s.headline)+'"></div><div class="field"><label>Homepage subtitle</label><textarea name="subtitle">'+esc(s.subtitle)+'</textarea></div><div class="field"><label>About</label><textarea name="about">'+esc(s.about)+'</textarea></div><div class="field"><label>Contact email</label><input name="contact" type="email" value="'+attr(s.contact)+'"></div><div class="field"><label>Shipping information</label><textarea name="shipping">'+esc(s.shipping)+'</textarea></div><button class="btn dark">Save settings</button></form><hr style="margin:30px 0;border:0;border-top:1px solid #ddd"><h3>More controls</h3><p class="muted">You can control calendar names, prices, categories, descriptions, badges, featured status, publishing, files, orders, order status, homepage copy, announcement text, contact information, shipping copy, and currency from Admin.</p>'}
function saveSettings(e){e.preventDefault();let f=new FormData(e.target);for(let [k,v] of f)state.settings[k]=v;save();toast('Settings saved')}
function openModal(){document.getElementById('modal').classList.add('show')}function closeModal(){document.getElementById('modal').classList.remove('show')}
function toast(t){let x=document.getElementById('toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',1800)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function attr(s){return esc(s)}
render();
</script>
</body>
</html>
